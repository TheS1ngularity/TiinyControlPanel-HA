name: Tiiny Control Panel
version: "1.4.1-ha5"
slug: tiiny_panel
description: Community web panel for a Tiiny AI device, shown inside Home Assistant
url: https://github.com/TheS1ngularity/TiinyControlPanel-HA
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8765
ingress_stream: true
panel_title: Tiiny
panel_icon: mdi:chip
panel_admin: true
watchdog: "http://[HOST]:[PORT:8765]/__tiiny__"
ports:
  8765/tcp: null
  8766/tcp: 8766
ports_description:
  8765/tcp: Panel opened directly (plain HTTP, needs its own sign-in). Leave off to use it only inside Home Assistant.
  8766/tcp: Gateway for apps on other machines. Also switch on "Apps on other computers" in the panel.
environment:
  TIINY_UI_TLS: "off"
  TIINY_UI_PORT: "8765"
options:
  trust_ha_login: true
  gateway_any_address: true
  auto_unlock: false
  allow_commands: false
  public_names: []
  log_requests: false
schema:
  trust_ha_login: bool
  gateway_any_address: bool
  auto_unlock: bool
  allow_commands: bool
  public_names:
    - str
  log_requests: bool
