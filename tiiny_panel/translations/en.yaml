configuration:
  trust_ha_login:
    name: Trust the Home Assistant login
    description: >-
      On: anyone who opens the panel through Home Assistant has full access, with no second sign-in. It is listed
      in the sidebar for administrators only, which hides it but may not block other users.
      Off: every browser must sign in to the panel itself with a sign-in link, also inside Home Assistant.
  gateway_any_address:
    name: "Gateway: accept any numeric address"
    description: >-
      On: apps on other machines can use the gateway at http://<Home Assistant address>:8766. Off: the gateway
      only answers its internal add-on address, as the original panel does, so only Home Assistant itself can use it.
      Requests sent to a host name are refused either way.
  tiiny_address:
    name: Tiiny address (optional)
    description: >-
      Your Tiiny's address on your network, for example 192.168.1.50. When filled in, the panel uses it and you
      don't have to enter it under Network. Give the Tiiny a fixed address in your router.
  auto_unlock:
    name: Unlock the Tiiny automatically
    description: >-
      After a restart or power cut the Tiiny keeps its data locked until someone logs in. On: the add-on checks once a
      minute and unlocks it with the key saved at your last log in from the panel. Anyone who can power the Tiiny on
      inside your network then gets an unlocked device, so leave this off if that matters to you.
  unlock_password:
    name: Tiiny password (optional)
    description: >-
      Only used when automatic unlock is on. The add-on logs in with it when no key is saved yet (a new install) or
      when the Tiiny refuses the saved key, and saves the new key. Leave empty to log in by hand in the panel
      instead. The password is stored unencrypted in Home Assistant and in its backups.
  allow_commands:
    name: Let the agent run commands
    description: >-
      The panel's agent may run commands and change files inside this add-on's container. It still asks before each one.
  public_names:
    name: Extra host names
    description: >-
      Names (not IP addresses) used to open the panel directly on port 8765, for example ha.local. Not needed for the sidebar.
  log_requests:
    name: Log every request
    description: For troubleshooting. Writes each HTTP request to the add-on log.
network:
  8765/tcp: Panel opened directly (plain HTTP)
  8766/tcp: Gateway for apps
